name: sceneTagger
description: "Bulk scraping panel for scenes — uses scrapeSingleScene"
version: "1.9.1"
url: "https://github.com/jojo-topo/stash-plugins/tree/master/sceneTagger"

exec:
  - C:\python310.6\python.exe
  - "{pluginDir}/blacklistBackup.py"
interface: raw
tasks:
  - name: "Backup studio blacklist"
    description: "Writes a snapshot of the studio blacklist to studioBlacklist_backup.json (independent safety net from config.yml)."

settings:
  autoCheckStudio:
    displayName: "Automatically check new studios"
    description: "If enabled, studios not yet present in Stash will be checked by default during scraping."
    type: BOOLEAN

  prioritizeExistingStudio:
    displayName: "Prioritize studio already in the database"
    description: "If enabled, when several studios are scraped and one already exists in Stash, it will be selected by default (radio button)."
    type: BOOLEAN

  autoCheckPerformer:
    displayName: "Automatically check new performers"
    description: "If enabled, performers not yet present in Stash will be checked by default during scraping."
    type: BOOLEAN

  autoCheckNewTags:
    displayName: "Automatically check new tags"
    description: "If enabled, tags not yet present in Stash will be checked by default during scraping."
    type: BOOLEAN

  autoCheckDetails:
    displayName: "Automatically check Details"
    description: "If enabled, the Details field will be checked by default during scraping (even if it only contains the Artists: list)."
    type: BOOLEAN

  studioBlacklist:
    displayName: "Studio blacklist (VA)"
    description: "Comma-separated list of studio names to ignore. Ex: name1, name2, name3"
    type: STRING

  autoAddOtherStudios:
    displayName: "Add other artists as Other studios"
    description: "If enabled, studios detected via the Artists: line but not chosen as the main studio are automatically linked as 'Other studios' (compatible with the skExtra-Multiple-Studios-Custom plugin)."
    type: BOOLEAN

  useUrlIfPresent:
    displayName: "Use existing URL if available"
    description: "If enabled, tries to scrape via the URL already saved on the scene before the scraper chain/manual mode."
    type: BOOLEAN

  manualFallbackOnFail:
    displayName: "Manual fill-in when scraping fails"
    description: "If enabled, a failed scrape shows the usual panel (studio/performers/tags/details) empty, ready to fill in by hand, instead of a plain error message."
    type: BOOLEAN

  manualFallbackAllowTitle:
    displayName: "Also allow manual title entry"
    description: "Sub-option of 'Manual fill-in when scraping fails': adds a text field to type the title by hand."
    type: BOOLEAN

  nativeHoverPreview:
    displayName: "Hover preview"
    description: "If enabled, hovering a thumbnail plays a preview - Stash's own generated preview clip if one exists, otherwise the source video streamed directly (seeked 10% in). No companion plugin required."
    type: BOOLEAN

  enableScrubControlsGrid:
    displayName: "Enable scrub controls - mass scrape panel"
    description: "If enabled, scrolling the mouse wheel over a hovered thumbnail in the mass scrape panel (list of scenes) seeks through the preview instead of just letting it loop - useful to check who appears throughout the scene before adding performers."
    type: BOOLEAN

  enableScrubControlsSolo:
    displayName: "Enable scrub controls - Scrape Scene popup"
    description: "Same as above, but for the single-scene 'Scrape Scene' popup (opened from a scene page) rather than the mass scrape panel."
    type: BOOLEAN

  scrubStepSlow:
    displayName: "Scrub step - slow (%)"
    description: "Percentage of the video's total duration moved by an isolated/slow wheel scroll. Default 1."
    type: NUMBER

  scrubStepNormal:
    displayName: "Scrub step - normal (%)"
    description: "Percentage of the video's total duration moved by a wheel scroll at a moderate pace. Default 3."
    type: NUMBER

  scrubStepFast:
    displayName: "Scrub step - fast (%)"
    description: "Percentage of the video's total duration moved by rapid, closely-spaced wheel scrolls. Default 6."
    type: NUMBER

  scrubMaxVelocityMultiplier:
    displayName: "Scrub max acceleration (x)"
    description: "Maximum multiplier applied to the scrub step when scrolling continuously in the same direction. Resets immediately on direction change or after a short pause. Default 3."
    type: NUMBER

  scrubBarVisible:
    displayName: "Show scrub progress bar"
    description: "If enabled, a thin clickable/draggable progress bar is shown at the bottom of the hovered thumbnail to seek directly with the mouse."
    type: BOOLEAN

  enableKeyboardSeek:
    displayName: "Keyboard seek (arrow keys)"
    description: "If enabled, the left/right arrow keys seek the preview backward/forward while a thumbnail is hovered."
    type: BOOLEAN

  keyboardSeekStep:
    displayName: "Keyboard seek step (seconds)"
    description: "Seconds moved backward/forward per arrow key press. Default 5."
    type: NUMBER

  autoMarkOrganized:
    displayName: "Mark scenes as organized on Apply"
    description: "If enabled, scenes are marked as organized by default when applied (overridable per scene via the 'Organized' row button)."
    type: BOOLEAN

ui:
  javascript:
    - sceneTagger.js
  css:
    - sceneTagger.css
