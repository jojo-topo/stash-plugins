name: sceneTagger
description: "Bulk scraping panel for scenes — uses scrapeSingleScene"
version: "1.31.1"
url: "https://github.com/jojo-topo/stash-plugins/tree/master/sceneTagger"

exec:
  - C:\python310.6\python.exe
  - "{pluginDir}/blacklistBackup.py"
interface: raw
tasks:
  - name: "Backup studio blacklist"
    description: "Writes a snapshot of the studio blacklist to studioBlacklist_backup.json (independent safety net from config.yml)."

settings:
  autoCheckStudio:
    displayName: "Automatically check new studios"
    description: "If enabled, studios not yet present in Stash will be checked by default during scraping."
    type: BOOLEAN

  prioritizeExistingStudio:
    displayName: "Prioritize studio already in the database"
    description: "If enabled, when several studios are scraped and one already exists in Stash, it will be selected by default (radio button)."
    type: BOOLEAN

  autoCheckPerformer:
    displayName: "Automatically check new performers"
    description: "If enabled, performers not yet present in Stash will be checked by default during scraping."
    type: BOOLEAN

  autoCheckNewTags:
    displayName: "Automatically check new tags"
    description: "If enabled, tags not yet present in Stash will be checked by default during scraping."
    type: BOOLEAN

  autoCheckDetails:
    displayName: "Automatically check Details"
    description: "If enabled, the Details field will be checked by default during scraping (even if it only contains the Artists: list)."
    type: BOOLEAN

  studioBlacklist:
    displayName: "Studio blacklist (VA)"
    description: "Comma-separated list of studio names to ignore. Ex: name1, name2, name3"
    type: STRING

  hideStudioBanner:
    displayName: "Hide studio banner"
    description: "If enabled, the studio banner (cover) is not shown in the studio cards; the logo stays."
    type: BOOLEAN

  hideStudioLogo:
    displayName: "Hide studio logo"
    description: "If enabled, the studio logo is not shown in the studio cards; the banner stays."
    type: BOOLEAN

  opaquePanel:
    displayName: "Frosted glass panel"
    description: "Stash UI with Liquid glass on only: the panel and its rows get a more solid, more blurred glass (set the two values below)."
    type: BOOLEAN

  stashuiPerPage:
    displayName: "Scenes per page (Stash UI list)"
    description: "Stash UI lists scroll without end, so the panel loads its own pages. 5-200, default 40."
    type: NUMBER

  glassSolid:
    displayName: "Frosted glass - solid fill (%)"
    description: "40-100, default 82. Higher = less see-through. Only used when Frosted glass panel is on."
    type: NUMBER

  glassBlur:
    displayName: "Frosted glass - blur (px)"
    description: "0-80, default 40. Only used when Frosted glass panel is on."
    type: NUMBER

  coverUnderThumb:
    displayName: "Cover under the thumbnail"
    description: "Mass list layout: if enabled, the Cover preview sits under the video thumbnail (compact); otherwise it is aligned with the title badge."
    type: BOOLEAN

  detailsEditorInList:
    displayName: "Full Details editor in the mass list"
    description: "If enabled, the mass list shows the full editable Details area (like the Scrape scene popup) instead of the short preview chip. The per-row Details checkbox stays."
    type: BOOLEAN

  showSceneTitleInHeader:
    displayName: "Show the scene title instead of the file name"
    description: "Mass list header badge: if enabled, shows the scene's own title instead of its file name when the scene has one (the file name stays in the tooltip)."
    type: BOOLEAN

  splitExistingNew:
    displayName: "Split existing / new data"
    description: "Mass list: if enabled, Performers and Tags are split into 'Already on this scene' and 'New from scrape' (stacked, or side by side with the sub-option). The 'New from scrape' title is hidden when nothing is new. Off by default."
    type: BOOLEAN

  splitSideBySide:
    displayName: "Split existing / new: side by side"
    description: "Sub-option of 'Split existing / new': shows 'Already on this scene' and 'New from scrape' side by side (Performers and Tags) instead of stacked."
    type: BOOLEAN

  useUrlIfPresent:
    displayName: "Use existing URL if available"
    description: "If enabled, tries to scrape via the URL already saved on the scene before the scraper chain/manual mode."
    type: BOOLEAN

  manualFallbackOnFail:
    displayName: "Manual fill-in when scraping fails"
    description: "If enabled, a failed scrape shows the usual panel (studio/performers/tags/details) empty, ready to fill in by hand, instead of a plain error message."
    type: BOOLEAN

  manualFallbackAllowTitle:
    displayName: "Also allow manual title entry"
    description: "Sub-option of 'Manual fill-in when scraping fails': adds a text field to type the title by hand."
    type: BOOLEAN

  manualFallbackPrefillFilename:
    displayName: "Pre-fill manual title with file name"
    description: "Sub-option of 'Also allow manual title entry': pre-fills the title field with the file name (extension stripped) after a failed scrape."
    type: BOOLEAN

  cleanSearchTitle:
    displayName: "Clean title in Search title"
    description: "Strips the file extension, dates, resolutions and punctuation from the text sent by 'Search title' (some scrapers like Pornhub return 404 otherwise)."
    type: BOOLEAN

  namePatternsOn:
    displayName: "Use my file-name patterns"
    description: "Cleans the file name with your own patterns (words, text or regex) before it fills 'Search title'. Nothing is renamed. Only a pattern with 'Scraped title' ticked changes the title that Apply saves."
    type: BOOLEAN

  namePatternsGlass:
    displayName: "Frosted glass window for the file-name patterns"
    description: "On (default) = the file-name patterns window is translucent, with its own two sliders (opacity and blur). Off = it is opaque."
    type: BOOLEAN

  namePatternsSolid:
    displayName: "File-name patterns window - opacity (%)"
    description: "40-100, default 90. Higher = less see-through. Only used when the frosted glass for the patterns window is on."
    type: NUMBER

  namePatternsBlur:
    displayName: "File-name patterns window - blur (px)"
    description: "0-80, default 30. Only used when the frosted glass for the patterns window is on."
    type: NUMBER

  nativeHoverPreview:
    displayName: "Hover preview"
    description: "If enabled, hovering a thumbnail plays a preview - Stash's own generated preview clip if one exists, otherwise the source video streamed directly (seeked 10% in). No companion plugin required."
    type: BOOLEAN

  enableScrubControlsGrid:
    displayName: "Enable scrub controls - mass scrape panel"
    description: "If enabled, scrolling the mouse wheel over a hovered thumbnail in the mass scrape panel (list of scenes) seeks through the preview instead of just letting it loop - useful to check who appears throughout the scene before adding performers."
    type: BOOLEAN

  enableScrubControlsSolo:
    displayName: "Enable scrub controls - Scrape Scene popup"
    description: "Same as above, but for the single-scene 'Scrape Scene' popup (opened from a scene page) rather than the mass scrape panel."
    type: BOOLEAN

  scrubStepSlow:
    displayName: "Scrub step - slow (%)"
    description: "Percentage of the video's total duration moved by an isolated/slow wheel scroll. Default 1."
    type: NUMBER

  scrubStepNormal:
    displayName: "Scrub step - normal (%)"
    description: "Percentage of the video's total duration moved by a wheel scroll at a moderate pace. Default 3."
    type: NUMBER

  scrubStepFast:
    displayName: "Scrub step - fast (%)"
    description: "Percentage of the video's total duration moved by rapid, closely-spaced wheel scrolls. Default 6."
    type: NUMBER

  scrubMaxVelocityMultiplier:
    displayName: "Scrub max acceleration (x)"
    description: "Maximum multiplier applied to the scrub step when scrolling continuously in the same direction. Resets immediately on direction change or after a short pause. Default 3."
    type: NUMBER

  scrubBarVisible:
    displayName: "Show scrub progress bar"
    description: "If enabled, a thin clickable/draggable progress bar is shown at the bottom of the hovered thumbnail to seek directly with the mouse."
    type: BOOLEAN

  enableKeyboardSeek:
    displayName: "Keyboard seek (arrow keys)"
    description: "If enabled, the left/right arrow keys seek the preview backward/forward while a thumbnail is hovered."
    type: BOOLEAN

  keyboardSeekStep:
    displayName: "Keyboard seek step (seconds)"
    description: "Seconds moved backward/forward per arrow key press. Default 5."
    type: NUMBER

  autoMarkOrganized:
    displayName: "Mark scenes as organized on Apply"
    description: "If enabled, scenes are marked as organized by default when applied (overridable per scene via the 'Organized' row button)."
    type: BOOLEAN

  suggestPerformers:
    displayName: "Suggest performers"
    description: "If enabled, the single-scene popup and the mass list show a Suggested block: performers whose name or alias appears in the scene title, file name, details or tags, with the reason and a score. Nothing is added until you press Apply."
    type: BOOLEAN

  suggestPrecheck:
    displayName: "Pre-check high-confidence suggestions"
    description: "If enabled, suggestions with a high score (full name in the title or file name) are checked by default. Others stay unchecked."
    type: BOOLEAN

  suggestMinScore:
    displayName: "Suggestions - minimum score (0-100)"
    description: "Weaker matches are hidden. Default 20; 35 and above are shown as medium, 55 and above as high."
    type: NUMBER

ui:
  javascript:
    - performerFinder.js
    - namePatterns.js
    - namePatternsUI.js
    - sceneTagger.js
  css:
    - sceneTagger.css
  assets:
    /: assets
