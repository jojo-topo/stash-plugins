name: Build plugin package

# Runs whenever sceneTagger's actual source files change on master - NOT
# when index.yml or the zip itself change, so the bot's own commit below
# never re-triggers this workflow (no infinite loop, [skip ci] kept anyway
# as a belt-and-suspenders safety net).
on:
  push:
    branches: [master]
    paths:
      - "sceneTagger/sceneTagger.yml"
      - "sceneTagger/sceneTagger.js"
      - "sceneTagger/sceneTagger.css"
  workflow_dispatch: # lets you trigger it manually from the Actions tab too

permissions:
  contents: write # needed so the bot can push the updated zip/index.yml back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruamel.yaml
        run: pip install ruamel.yaml

      - name: Zip sceneTagger package
        run: |
          cd sceneTagger
          zip -j ../sceneTagger.zip sceneTagger.yml sceneTagger.js sceneTagger.css

      - name: Update index.yml (path, sha256, version, date)
        run: python3 .github/scripts/update_index.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sceneTagger.zip index.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-build sceneTagger.zip [skip ci]"
            git push
          fi
